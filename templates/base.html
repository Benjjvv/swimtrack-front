<!doctype html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="st-analyze-url" content="{{ url_for('ai_analyze') }}">
  <title>{% block title %}SwimTrack{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
  {% block head_extra %}{% endblock %}
</head>
<body>
  <div class="st-app" id="stApp">

    <aside class="st-sidebar" id="sidebar">
      <div class="st-brand">
        <i class="bi bi-water"></i>
        <span class="st-brand-name">SwimTrack</span>
      </div>

      <nav class="st-nav">
        <a href="{{ url_for('monitor') }}"
           class="st-nav-link {% if active == 'monitor' %}active{% endif %}">
          <i class="bi bi-camera-video"></i>
          <span>Monitor</span>
        </a>
        <a href="{{ url_for('swimmers') }}"
           class="st-nav-link {% if active == 'swimmers' %}active{% endif %}">
          <i class="bi bi-people"></i>
          <span>Nadadores</span>
        </a>
        <a href="{{ url_for('history') }}"
           class="st-nav-link {% if active == 'history' %}active{% endif %}">
          <i class="bi bi-clock-history"></i>
          <span>Historial</span>
        </a>
        <a href="{{ url_for('analysis') }}"
           class="st-nav-link {% if active == 'analysis' %}active{% endif %}">
          <i class="bi bi-graph-up"></i>
          <span>Análisis IA</span>
        </a>
        <a href="{{ url_for('demo') }}"
           class="st-nav-link {% if active == 'demo' %}active{% endif %}">
          <i class="bi bi-play-circle"></i>
          <span>Demo</span>
        </a>
        <div class="st-debug-menu" id="debugMenu">
          <button class="st-debug-toggle" id="debugMenuToggle" type="button"
                  aria-expanded="false" aria-controls="debugMenuOptions">
            <i class="bi bi-bug"></i>
            <span>Debug</span>
            <i class="bi bi-chevron-down st-debug-chevron" aria-hidden="true"></i>
          </button>
          <div class="st-debug-options" id="debugMenuOptions" hidden>
            <label class="st-debug-option">
              <input type="checkbox" data-box-debug-setting="showValues">
              <span>Mostrar valores</span>
            </label>
            <label class="st-debug-option">
              <input type="checkbox" data-box-debug-setting="showCenters">
              <span>Dibujar cruz central</span>
            </label>
            <label class="st-debug-option">
              <input type="checkbox" data-box-debug-setting="showTrails">
              <span>Mostrar estelas</span>
            </label>
            <label class="st-debug-option">
              <span>Umbral de vueltas</span>
              <input type="number" min="0" max="1" step="0.01" inputmode="decimal"
                     aria-label="Umbral de confianza para vueltas"
                     data-box-debug-setting="lapConfidenceThreshold">
            </label>
          </div>
        </div>
      </nav>
    </aside>

    <div class="st-main">
      <header class="st-header">
        <button class="st-sidebar-toggle" id="sidebarToggle" aria-label="Mostrar/ocultar menú">
          <i class="bi bi-list"></i>
        </button>
        <h1 class="st-header-title">{% block header_title %}SwimTrack{% endblock %}</h1>
      </header>

      <main class="st-content">
        {% block content %}{% endblock %}
      </main>
    </div>

  </div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"
       aria-live="polite" aria-atomic="true"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
